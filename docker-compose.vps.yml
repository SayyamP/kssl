# ENVIRONMENT PREFIX. Container names carry ${KSSL_PREFIX:-kssl} so the same compose file
# can run on all three hosts without colliding: prod keeps the bare `kssl-` names, staging
# on VPS-A uses `kssl-stg-`, dev at the data centre uses `kssl-dev-`. VPS-A already runs a
# container called kssl-gliner for the dashboards, which is exactly the collision this
# avoids. Published ports are already env-driven (KSSL_DB_PORT, KSSL_OLLAMA_PORT,
# LLMAPI_PORT) and each environment file picks a distinct set.
# The VPS stack: Postgres + backend + built frontend, published through the
# Traefik that is ALREADY running on this server.
#
#   cp .env.example .env && edit .env
#   docker compose -f docker-compose.vps.yml up -d
#
# THE FRONT DOOR IS NOT OURS. 62.72.59.79 already runs `traefik-traefik-1` on the
# host network, holding :80 and :443 with a Let's Encrypt resolver and an HTTP->HTTPS
# redirect. Starting our own Caddy there would have collided with it and taken a
# co-tenant's sites down. So nothing here publishes 80/443: the two web containers
# carry Traefik labels and Traefik routes to them.
#
# What is here: Postgres (extracted + serving + metrics), the API, the built
# frontend, and the signal LLM. What is NOT here: the crawler and Layer A/B
# extraction -- those run at the data centre and write in over an SSH tunnel.
# The split, and the measurements behind it, are in DEPLOY.md.
#
# Every limit here is a HARD cap (`cpus`, `mem_limit`). cpu_shares is a weight: it
# decides who wins once the box is already contended, which is the moment the
# dashboard has already stopped answering.

name: kssl

services:
  db:
    image: postgres:16
    container_name: ${KSSL_PREFIX:-kssl}-db
    environment:
      POSTGRES_PASSWORD: ${KSSL_DB_PASSWORD:?set KSSL_DB_PASSWORD in .env}
      POSTGRES_DB: ${KSSL_DB_NAME:-kssl}
      POSTGRES_USER: ${KSSL_DB_USER:-postgres}
    # loopback only: the database is reached through the SSH tunnel, never the net
    ports:
      - "127.0.0.1:${KSSL_DB_PORT:-5460}:5432"
    # POSTGRES PUTS ITS PARALLEL QUERY WORKERS IN /dev/shm, AND DOCKER GIVES A CONTAINER
    # 64MB OF IT. Every filesystem on this host has 343GB free, so the failure reads as
    # absurd and gets misfiled as a full disk:
    #
    #   psycopg.errors.DiskFull: could not resize shared memory segment
    #     "/PostgreSQL.3042025728" to 4194304 bytes: No space left on device
    #
    # That is 4MB being refused. Measured on prod 2026-09-06 19:07:51 -- three parallel
    # workers of ONE query failing together, with `docker exec kssl-db df -h /dev/shm`
    # reporting a 64M filesystem while the host reported 343G free.
    #
    # What it took down was `route.py --enqueue`, the step that puts newly synced
    # documents into the extract queue. The feeder logs that as "enqueue failed
    # (continuing)" and carries on, so a cycle where NOTHING entered extraction looks
    # exactly like a cycle with nothing to do. Nothing downstream notices; the queue just
    # runs emptier than it should, and the fleet does correspondingly less work.
    #
    # It gets likelier as the tables grow, because the planner reaches for a parallel scan
    # sooner -- max_connections above is sized for 198 workers, and every one of them can
    # provoke a parallel plan. This is RAM-backed, not disk, and 1GB is what the postgres
    # image's own documentation suggests for a server of this size.
    shm_size: 1gb
    # max_connections is 300, not the default 60. Each extraction worker holds exactly one
    # connection for its whole life, so this number caps the worker fleet -- and the fleet is
    # the throughput ceiling: at 60 the GPU farms sat at ~0.9 concurrent requests per node
    # against a measured knee of 6. The database, not the GPUs, was the limit.
    #
    # A -c flag beats BOTH postgresql.conf and an ALTER SYSTEM in postgresql.auto.conf, so this
    # line is the only place the limit is really set. `ALTER SYSTEM SET max_connections = 200`
    # was run once and never took effect: the server kept starting at 60 and nothing said why.
    # Change it HERE.
    #
    # 300 is sized for both farms full: 9 Kharghar nodes x 6 + 12 Pune nodes x 12 = 198 slots,
    # needing ~198 workers + ~12 service connections = 210, plus room for a human holding a
    # psql session. Worst case 300 x work_mem 32MB + 2GB shared_buffers = 11.4 GB of 31 GB.
    #
    # Running out is not a graceful degradation: a worker that cannot connect crashes and
    # restarts, and each restart re-opens a connection, so the shortage feeds itself until
    # even psql is refused. 143 workers against 60 slots took the dashboard down on 2026-09-02.
    #
    # NOTE: `command: >` is a FOLDED scalar -- every line below is joined into one command
    # string, so a `#` comment inside it becomes a literal argument and postgres refuses to
    # start with: invalid argument "#". Keep comments above this key, never inside it.
    command: >
      postgres
      -c shared_buffers=2GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c max_connections=300
    volumes:
      - kssl_pgdata:/var/lib/postgresql/data
      # init scripts run in name order, on a FRESH volume only
      - ./db/00_documents.sql:/docker-entrypoint-initdb.d/00_documents.sql:ro
      - ./db/01_extracted.sql:/docker-entrypoint-initdb.d/01_extracted.sql:ro
      - ./db/02_serving.sql:/docker-entrypoint-initdb.d/02_serving.sql:ro
      - ./db/03_serving_live.sql:/docker-entrypoint-initdb.d/03_serving_live.sql:ro
      - ./db/04_comments.sql:/docker-entrypoint-initdb.d/04_comments.sql:ro
      # every stage reports its wall clock here -- see pipeline/stage_timer.py
      - ./db/05_metrics.sql:/docker-entrypoint-initdb.d/05_metrics.sql:ro
      # the article-bench job queue (see bench/worker.py)
      - ./db/06_bench.sql:/docker-entrypoint-initdb.d/06_bench.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KSSL_DB_USER:-postgres} -d ${KSSL_DB_NAME:-kssl}"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: ${KSSL_DB_CPUS:-2}
    mem_limit: ${KSSL_DB_MEM:-8g}
    restart: unless-stopped

  backend:
    build:
      # repo root, so the image can include pipeline/stage_timer.py without a
      # second copy of it living under backend/
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${KSSL_PREFIX:-kssl}-backend
    environment:
      KSSL_DSN: host=db port=5432 dbname=${KSSL_DB_NAME:-kssl} user=${KSSL_DB_USER:-postgres} password=${KSSL_DB_PASSWORD}
      KSSL_SERVE_ORIGIN: ${KSSL_SERVE_ORIGIN:-live}
      # the API records its own serve time as the 'frontend' stage
      KSSL_METRICS_DSN: host=db port=5432 dbname=${KSSL_DB_NAME:-kssl} user=${KSSL_DB_USER:-postgres} password=${KSSL_DB_PASSWORD}
      # set HERE, not in .env: .env is copied to several machines, and a
      # data-centre timing labelled 'vps' is worse than one labelled unknown
      KSSL_HOST_ROLE: vps
    volumes:
      # Mounted, not baked. The production write-up is regenerated from the live
      # metrics table; if it were in the image, every regeneration would mean a
      # rebuild and the page on screen would drift behind the database it claims
      # to be reporting.
      - ./PRODUCTION.html:/app/PRODUCTION.html:ro
    expose:
      - "8600"
    depends_on:
      db:
        condition: service_healthy
    labels:
      # /api on the same host name as the app, so the built frontend's relative
      # fetches work with no CORS and no second certificate
      traefik.enable: "true"
      traefik.docker.network: kssl_default
      traefik.http.routers.kssl-api.rule: Host(`${KSSL_DOMAIN:?set KSSL_DOMAIN in .env}`) && PathPrefix(`/api`)
      traefik.http.routers.kssl-api.entrypoints: websecure
      traefik.http.routers.kssl-api.tls.certresolver: letsencrypt
      traefik.http.routers.kssl-api.priority: "20"
      traefik.http.routers.kssl-api.middlewares: kssl-auth
      traefik.http.services.kssl-api.loadbalancer.server.port: "8600"
      # The dataset is the client's competitive position. Without this it is
      # served to anyone who guesses the hostname.
      traefik.http.middlewares.kssl-auth.basicauth.users: ${KSSL_BASIC_AUTH:?set KSSL_BASIC_AUTH in .env}
      traefik.http.middlewares.kssl-auth.basicauth.realm: KSSL
    cpus: ${KSSL_API_CPUS:-1}
    mem_limit: ${KSSL_API_MEM:-1g}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ${KSSL_PREFIX:-kssl}-frontend
    expose:
      - "80"
    depends_on:
      - backend
    labels:
      traefik.enable: "true"
      traefik.docker.network: kssl_default
      traefik.http.routers.kssl-web.rule: Host(`${KSSL_DOMAIN}`)
      traefik.http.routers.kssl-web.entrypoints: websecure
      traefik.http.routers.kssl-web.tls.certresolver: letsencrypt
      # lower than the API router, so /api wins on the same host
      traefik.http.routers.kssl-web.priority: "10"
      traefik.http.services.kssl-web.loadbalancer.server.port: "80"
      traefik.http.routers.kssl-web.middlewares: kssl-auth,kssl-sec
      traefik.http.middlewares.kssl-sec.headers.frameDeny: "true"
      traefik.http.middlewares.kssl-sec.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.kssl-sec.headers.referrerPolicy: strict-origin-when-cross-origin
    cpus: ${KSSL_WEB_CPUS:-0.5}
    mem_limit: ${KSSL_WEB_MEM:-256m}
    restart: unless-stopped

  # The signal LLM. This IS part of the stack -- it writes the cards the
  # dashboard shows.
  #
  # Measured on this box (deploy/remote/bench_cpu_llm.py, no GPU), qwen2.5:7b
  # generating a real ~145-token signal card:
  #
  #     cores   gen tok/s   one card
  #       2        2.5        60 s
  #       3        4.0        37 s
  #       4        5.3        28 s
  #       6       10.5        14 s
  #
  # so cores bought here are bought at roughly 1.7 tok/s each, and the model
  # holds 5.5 GB resident whatever it is given. An earlier draft of DEPLOY.md
  # said a pipeline pass would take "days"; that assumed 600-token answers and
  # was wrong -- a few hundred cards at 14-28 s each is under two hours.
  llm:
    image: ollama/ollama:latest
    container_name: ${KSSL_PREFIX:-kssl}-llm
    environment:
      OLLAMA_MODELS: /models
      # one request at a time; parallelism buys nothing without a GPU and
      # multiplies the KV cache (measured: NUM_PARALLEL=24 wedged a 14b)
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # unset, ollama reserves 32k per slot and the RAM figure above triples
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "60m"
    # loopback-published, not merely exposed: the pipeline runs on the host (or
    # reaches in over the SSH tunnel), and with `expose` alone nothing could
    # call the model this service exists to serve.
    ports:
      - "127.0.0.1:${KSSL_OLLAMA_PORT:-11434}:11434"
    volumes:
      # a directory, not a named volume: the models are 16 GB and are pulled
      # once per machine, so they must survive `down -v` and be shareable with
      # the benchmark container.
      - ${KSSL_MODELS_DIR:-./models}:/models
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    cpus: ${KSSL_LLM_CPUS:-4}
    mem_limit: ${KSSL_LLM_MEM:-8g}
    restart: unless-stopped

  # GLiNER, on THIS box. It used to run in-process as a torch model inside whichever
  # worker needed it, and the only alternative was the farm -- the least reliable node in
  # the fleet. Now every node serves it and the router picks, so nothing depends on the farm.
  gliner:
    build: {context: ./llmapi/gliner_server}
    image: kssl-gliner:latest
    container_name: ${KSSL_PREFIX:-kssl}-gliner
    environment:
      GLINER_BIND: 0.0.0.0
      GLINER_PORT: ${GLINER_PORT:-8620}
      GLINER_MODEL: ${GLINER_MODEL:-urchade/gliner_multi-v2.1}
      GLINER_THRESHOLD: ${GLINER_THRESHOLD:-0.2}
      # torch scales at ~6% efficiency past 8 threads and competes with Ollama for the
      # same cores. Fewer here means more left for generation, which is the real bottleneck.
      GLINER_THREADS: ${GLINER_THREADS:-2}
    expose: ["${GLINER_PORT:-8620}"]
    volumes: [hf_models:/models]
    healthcheck:
      # 503 until the model is resident, so a cold container is never routed to.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:${GLINER_PORT:-8620}/healthz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    cpus: ${GLINER_CPUS:-2}
    mem_limit: ${GLINER_MEM:-4g}
    restart: unless-stopped

  # --- the two tunnels that make vps-a and the DC reachable from here -----------------
  # VPS-B is the hub and dials OUT to both. That works because the DC drops every inbound
  # port except ssh, and it means the hub owns both tunnels: either can be restarted
  # without touching a machine other people also use.
  #
  # Each publishes NOTHING. The forward binds inside the container on the compose network,
  # so llmapi reaches it by service name and the world cannot.
  tunnel-vpsa:
    build: {context: ./llmapi/tunnel}
    image: kssl-tunnel-hub:latest
    container_name: ${KSSL_PREFIX:-kssl}-tunnel-vpsa
    environment:
      REMOTE_NAME: vps-a
      REMOTE_HOST: ${VPSA_SSH_HOST:-}   # inert unless the "hub" is configured
      REMOTE_USER: ${VPSA_SSH_USER:-root}
      REMOTE_PORT: ${VPSA_SSH_PORT:-22}
      TARGET: ${VPSA_TARGET:-127.0.0.1:11434}   # as seen FROM vps-a: its own loopback
      LOCAL_PORT: ${VPSA_TUNNEL_PORT:-11502}
      # second forward: that box's GLiNER, on the same ssh session
      TARGET2: ${VPSA_GLINER_TARGET:-127.0.0.1:8620}
      LOCAL_PORT2: ${VPSA_GLINER_TUNNEL_PORT:-11512}
    volumes:
      - ${VPSA_SSH_KEY:-/dev/null}:/keys/id_tunnel:ro
    restart: unless-stopped
    mem_limit: 64m

  tunnel-dc:
    build: {context: ./llmapi/tunnel}
    image: kssl-tunnel-hub:latest
    container_name: ${KSSL_PREFIX:-kssl}-tunnel-dc
    environment:
      REMOTE_NAME: dc
      REMOTE_HOST: ${DC_SSH_HOST:-}   # inert unless the "hub" is configured
      REMOTE_USER: ${DC_SSH_USER:-sysadmin}
      REMOTE_PORT: ${DC_SSH_PORT:-45632}
      # NOT the DC's loopback. kssl-extract-ollama publishes no port to its own host, so
      # the only way in is its docker-network address -- resolved on the REMOTE side.
      TARGET: ${DC_TARGET:-172.24.0.2:11434}
      LOCAL_PORT: ${DC_TUNNEL_PORT:-11503}
      # second forward: that box's GLiNER, on the same ssh session
      TARGET2: ${DC_GLINER_TARGET:-127.0.0.1:8620}
      LOCAL_PORT2: ${DC_GLINER_TUNNEL_PORT:-11513}
    volumes:
      - ${DC_SSH_KEY:-/dev/null}:/keys/id_tunnel:ro
    restart: unless-stopped
    mem_limit: 64m

  # The LLM / GLiNER API. Every model call in the system goes through this, and it runs
  # HERE -- on VPS-B, beside the Ollama it fronts and inside the same failure domain as
  # the pipeline that calls it.
  #
  # NOT PUBLISHED, and not behind Traefik. It holds the farm's Bearer key and answers only
  # the pipeline on this host, so it binds loopback and joins the compose network for the
  # containers that need it. Nothing about it is a public surface.
  #
  # It reaches its own box's Ollama by SERVICE NAME, not 127.0.0.1: inside a container,
  # loopback is the container, so VPSB_URL is overridden here to the compose alias. This
  # is exactly the "the address is relative to the caller" trap llmapi/nodes.py refuses.
  llmapi:
    build:
      context: ./llmapi
      dockerfile: Dockerfile
    image: kssl-llmapi:latest
    container_name: ${KSSL_PREFIX:-kssl}-llmapi
    environment:
      LLMAPI_BIND: 0.0.0.0
      LLMAPI_PORT: ${LLMAPI_PORT:-8610}
      LLM_ORIGIN: ${LLM_ORIGIN:-vps-b}
      LLM_NODE_ORDER: ${LLM_NODE_ORDER:-vps-b,farm}
      NODE_MODEL: ${NODE_MODEL:-qwen2.5:7b}
      NODE_NUM_CTX: ${NODE_NUM_CTX:-8192}
      # the local node, as addressed FROM THIS CONTAINER
      VPSB_URL: http://llm:11434
      VPSB_ENABLED: "1"
      VPSB_TOK_S: ${VPSB_TOK_S:-11.95}
      VPSB_THREADS: ${KSSL_LLM_THREADS:-4}
      VPSB_CPU: "1"
      FARM_URL: ${FARM_URL:-https://ollama.i3softlab.com}
      FARM_ENABLED: ${FARM_ENABLED:-1}
      FARM_OPENAI: "1"
      FARM_API_KEY: ${FARM_API_KEY:-}
      FARM_TOK_S: ${FARM_TOK_S:-53.5}
      # vps-a and the DC, reached through the two tunnel containers by SERVICE NAME. Not
      # 127.0.0.1: inside this container loopback is this container, which is exactly the
      # trap nodes.check_config() refuses at startup.
      VPSA_URL: http://tunnel-vpsa:${VPSA_TUNNEL_PORT:-11502}
      VPSA_ENABLED: ${VPSA_ENABLED:-0}
      VPSA_TOK_S: ${VPSA_TOK_S:-8.3}
      DC_URL: http://tunnel-dc:${DC_TUNNEL_PORT:-11503}
      DC_ENABLED: ${DC_ENABLED:-0}
      DC_TOK_S: ${DC_TOK_S:-1.5}
      # GLiNER now runs on EVERY node; the router picks the same way it does for
      # generation. The farm is one entry in the list, not the only one.
      GLINER_NODE_ORDER: ${GLINER_NODE_ORDER:-vps-b,vps-a,dc,farm}
      VPSB_GLINER_URL: http://gliner:${GLINER_PORT:-8620}/extract
      VPSA_GLINER_URL: http://tunnel-vpsa:${VPSA_GLINER_TUNNEL_PORT:-11512}/extract
      DC_GLINER_URL: http://tunnel-dc:${DC_GLINER_TUNNEL_PORT:-11513}/extract
      FARM_GLINER_URL: ${FARM_GLINER_URL:-https://ollama.i3softlab.com/extract}
      GLINER_ENABLED: ${GLINER_ENABLED:-1}
      GLINER_THRESHOLD: ${GLINER_THRESHOLD:-0.2}
      LLM_TIMEOUT_FLOOR: ${LLM_TIMEOUT_FLOOR:-180}
      LLM_TIMEOUT_CEIL: ${LLM_TIMEOUT_CEIL:-1800}
      LLM_RETRIES: ${LLM_RETRIES:-2}
    expose:
      - "${LLMAPI_PORT:-8610}"
    ports:
      # loopback only -- for the pipeline running on the HOST rather than in a container
      - "127.0.0.1:${LLMAPI_PORT:-8610}:${LLMAPI_PORT:-8610}"
    depends_on:
      llm:
        condition: service_healthy
      gliner:
        condition: service_healthy
    healthcheck:
      # /healthz 503s when no node can serve a call, so an unkeyed farm or a missing URL
      # shows up as an unhealthy container instead of as failed cards an hour later.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:${LLMAPI_PORT:-8610}/healthz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    cpus: ${LLMAPI_CPUS:-0.5}
    mem_limit: ${LLMAPI_MEM:-512m}
    restart: unless-stopped

volumes:
  kssl_pgdata:
  hf_models:   # GLiNER model cache; gliner is brought up out-of-band, deploy never recreates it
