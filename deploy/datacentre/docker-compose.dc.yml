# The data centre's half of the deployment.
#
#   docker compose -f docker-compose.dc.yml --env-file dc.env up -d --build
#
# WHAT RUNS WHERE, AND WHY
# ------------------------
# Extraction is the expensive stage and it needs the corpus, so it belongs on
# this 40-core box beside it. The LLM that writes cards, the database, the API
# and the dashboard are on the VPS. Nothing runs on anybody's workstation.
#
#   corpus (here)  ->  Layer A/B (here)  ->  VPS database  ->  VPS model  ->  UI
#
# Three services:
#   tunnel     the only path from here to the VPS: two forwards, no open port
#   autopilot  the daily loop -- new documents in, cards out
#   bench      the "paste an article and watch it" worker behind /api/bench
#
# CORES -- one lane each, no sharing
# ----------------------------------
# 40 cores, divided so that nothing here can starve anything else. The old
# division put the extraction MODEL and the extraction WORKERS on the same ten
# cores, which meant GLiNER and the 7B fought each other for the whole batch.
# They are different kinds of work and they now have different cores.
#
#   0-19   crawler fleet          (7 instances, camofox, ingest, orchestrator)
#   20-26  extraction model       kssl-extract-ollama, qwen2.5:7b
#   27-33  extraction workers     kssl-autopilot + kssl-bench (GLiNER, torch)
#   34     lab LLMs               llm-ab / extraction-lab / llm-camofox
#   35-39  data stores            corpus Postgres, MinIO, sipri
#
# Two rules that have cost real time here:
#
# * Do NOT convert cpuset to a `cpus:` quota. A CFS quota inflates latency,
#   fires the engine's watchdog, and the crawler's governors read HOST cpu
#   rather than their cgroup. Caps on this box have been lethal.
# * A cpuset alone does not size a thread pool. Ollama and torch both count the
#   HOST's cores; both need telling separately (OMP_NUM_THREADS below, and
#   ollama reads its affinity correctly only because it is a cpuset and not a
#   quota). Getting this wrong is not a slowdown, it is a 4:1 thrash.

name: kssl-dc

x-extract: &extract
  image: kssl-extraction:latest
  cpuset: "${KSSL_EXTRACT_CPUSET:-27-33}"
  mem_limit: ${KSSL_EXTRACT_MEM:-48g}
  working_dir: /app
  restart: unless-stopped
  volumes:
    # mounted, not baked: a code change here is a `docker restart`, not a build
    - ${KSSL_APP_DIR:-/home/sysadmin/kssl/app}:/app
    # the engine writes its staging jsonl and sqlite under data/, so NOT read-only
    - ${KSSL_ENGINE_DIR:-/home/sysadmin/kssl/engine/l2}:/l2
    - kssl_hf:/models
  environment: &extract_env
    # --- where the results go: the VPS database, through the tunnel container
    KSSL_DSN: host=kssl-tunnel port=5460 dbname=${KSSL_DB_NAME:-kssl} user=${KSSL_DB_USER:-postgres} password=${KSSL_DB_PASSWORD:?set KSSL_DB_PASSWORD}
    KSSL_METRICS_DSN: host=kssl-tunnel port=5460 dbname=${KSSL_DB_NAME:-kssl} user=${KSSL_DB_USER:-postgres} password=${KSSL_DB_PASSWORD}
    # --- where the documents come from: the corpus, by container name on its
    #     own network. Reaching it at 172.17.0.1:5432 hangs silently -- the
    #     firewall DROPs that in DOCKER-USER.
    KSSL_CORPUS_DSN: host=mallory-data-postgres-1 port=5432 dbname=mallory user=mallory password=${KSSL_CORPUS_PASSWORD:?set KSSL_CORPUS_PASSWORD}
    # --- the two models, and they are deliberately on different machines
    # extraction's comprehension pass: this box's own Ollama, on the L2 lane
    OLLAMA_URL: http://kssl-extract-ollama:11434
    C_MODEL: ${C_MODEL:-qwen2.5:7b}
    C_EMBED: ${C_EMBED:-nomic-embed-text:latest}
    C_GLINER: urchade/gliner_multi-v2.1
    # recall lost at the finder is unrecoverable downstream: do not raise
    C_GLINER_TH: "0.2"
    # Pin the comprehension model's context and thread count. Both exist because
    # llama.cpp counts the HOST's cores and because Ollama starts a new runner
    # for every distinct num_ctx -- see the comment in comprehend.py. Without
    # these two, extraction on CPU spends its time reloading 3 GB of weights.
    C_NUM_CTX: ${C_NUM_CTX:-16384}
    C_LLM_THREADS: ${C_LLM_THREADS:-6}
    # Two more GPU-era numbers that are wrong on CPU. The reply ceiling is
    # 24,000 tokens by default -- irrelevant at GPU speed, but ~100 minutes of
    # wall clock here for a single chunk that fails to terminate. And the HTTP
    # timeout is 420 s, which a CPU chunk can legitimately exceed: when the
    # client gives up, llama.cpp keeps generating and the retry queues behind
    # it, so a low timeout multiplies the work instead of bounding it.
    C_BUDGET_CAP: ${C_BUDGET_CAP:-4000}
    C_LLM_TIMEOUT: ${C_LLM_TIMEOUT:-1800}
    # Seconds allowed per document in Layer A. Measured here 2026-08-26: one
    # article = 13.8 min GLiNER + comprehension calls of 21m26s and 26m21s, and
    # the old one-hour ceiling killed it mid-document and threw the lot away. A
    # budget smaller than the work protects nothing.
    C_PER_DOC_S: ${C_PER_DOC_S:-10800}
    # comprehend.py hardcodes 24, which oversubscribes a 10-core lane
    C_THREADS: ${C_THREADS:-7}
    # ...and C_THREADS alone is not enough. comprehend.py calls
    # torch.set_num_threads() when it loads GLiNER, which is *after* torch,
    # OpenMP and MKL have already sized their pools -- and they size them from
    # the HOST core count, because os.cpu_count() does not read the cpuset.
    # Measured: one 6 KB article, 40 threads on 10 cores, 20 CPU-minutes and
    # still running. These three are read at library init, so they are the
    # ones that actually decide. Same failure as ollama ignoring its cgroup.
    OMP_NUM_THREADS: ${C_THREADS:-7}
    MKL_NUM_THREADS: ${C_THREADS:-7}
    OPENBLAS_NUM_THREADS: ${C_THREADS:-7}
    # the fast tokenizer forks its own pool per call and warns about it
    TOKENIZERS_PARALLELISM: "false"
    HF_HOME: /models
    # the card writer: the VPS model, through the tunnel. This is the stage the
    # client's dashboard depends on, and it stays on the machine that serves it.
    KSSL_OLLAMA: http://kssl-tunnel:11500
    KSSL_MODEL: ${KSSL_MODEL:-qwen2.5:14b-instruct}
    # the VPS has no GPU: pin threads to its container cap (worth ~2x) and give
    # the call a timeout that a CPU model can actually meet
    KSSL_LLM_CPU: "1"
    KSSL_LLM_THREADS: ${KSSL_LLM_THREADS:-4}
    # stamps every metrics row. Guessing this from the hostname is how a
    # data-centre timing ends up labelled 'vps'.
    KSSL_HOST_ROLE: datacentre
    PYTHONUNBUFFERED: "1"
  networks: [kssl, corpus]
  depends_on:
    # not a plain depends_on: the tunnel's container is "up" a second before the
    # forward accepts anything, and a worker that starts in that second dies on
    # connection refused and restarts, forever. Wait for the port, not the process.
    tunnel:
      condition: service_healthy
    ollama:
      condition: service_started

services:
  # The extraction model. It was started by hand outside any compose file, which
  # is how it ended up sharing cores with the workers that call it and how a
  # wedged generation could sit at 7.5 cores for half an hour with nobody
  # noticing. Declared here, it has a lane, a keep-alive and a restart policy.
  ollama:
    image: ollama/ollama:latest
    container_name: kssl-extract-ollama
    cpuset: "${KSSL_OLLAMA_CPUSET:-20-26}"
    mem_limit: ${KSSL_OLLAMA_MEM:-24g}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      # one slot. The comprehension pass is a long generation on CPU; a second
      # concurrent slot does not add throughput on seven cores, it just makes
      # every caller wait for the slowest.
      OLLAMA_NUM_PARALLEL: "1"
      # Two, not one. The engine uses qwen2.5:7b AND nomic-embed-text; at one
      # loaded model Ollama evicts the 7B to load the 300 MB embedder and then
      # reloads it -- 5.5 GB in and out on every alternation. They both fit.
      OLLAMA_MAX_LOADED_MODELS: "2"
      # unset, this is 32768 per slot and the KV cache eats the memory budget.
      # It must match C_NUM_CTX on the caller: if the request asks for a context
      # this default does not have, Ollama starts another runner, which is the
      # reload loop all over again. One number, set in two places that agree.
      OLLAMA_CONTEXT_LENGTH: "${C_NUM_CTX:-16384}"
      # GLiNER runs for minutes between LLM calls. At the 5-minute default the
      # model is unloaded and reloaded once per document.
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ${KSSL_OLLAMA_MODELS:-/home/sysadmin/kssl/models}:/models
    networks:
      kssl:
        # the workers address it by this name, and so does anything left over
        # from when it was a standalone container. Compose would add the alias
        # anyway; saying it out loud means a rename cannot silently break them.
        aliases: [kssl-extract-ollama]

  tunnel:
    build: ./tunnel
    image: kssl-tunnel:latest
    container_name: kssl-tunnel
    restart: unless-stopped
    environment:
      VPS_HOST: ${KSSL_VPS_HOST:?set KSSL_VPS_HOST}
      VPS_USER: ${KSSL_VPS_USER:-root}
      VPS_SSH_PORT: ${KSSL_VPS_SSH_PORT:-22}
    volumes:
      - ${KSSL_SSH_DIR:-/home/sysadmin/kssl/ssh}:/keys:ro
    healthcheck:
      # both forwards, because ExitOnForwardFailure only catches the failure at
      # setup -- a forward that dies later leaves the session happily alive
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5460 && nc -z 127.0.0.1 11500"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [kssl]

  autopilot:
    <<: *extract
    container_name: kssl-autopilot
    command: >
      python pipeline/autopilot.py
      --batch ${KSSL_BATCH:-8}
      --workers ${KSSL_WORKERS:-4}
      --every ${KSSL_EVERY:-1800}

  bench:
    <<: *extract
    container_name: kssl-bench
    # a person is watching this one, so it polls tightly and takes one job at a
    # time; it shares the lane with autopilot rather than getting its own
    command: python bench/worker.py --poll 3
    environment:
      <<: *extract_env
      KSSL_WORKER_NAME: dc-bench

networks:
  kssl:
    name: kssl-dc
  # the corpus's own network. Container-to-container never touches the host
  # interface, so the firewall rule keeping the corpus off the internet holds.
  corpus:
    external: true
    name: mallory-data_default

volumes:
  kssl_hf:
