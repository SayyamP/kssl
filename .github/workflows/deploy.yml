name: Deploy to VPS-B

# Push to kssl-deploy → build+push SHA-pinned images to GHCR. The deploy to VPS-B then
# rsyncs the exact commit's source (compose, db/*.sql, deploy/) and recreates ONLY
# frontend+backend from GHCR — the extraction farm and DB/LLM containers are never touched.
#
# SAFETY: the deploy job only runs when the repo variable DEPLOY_ENABLED == 'true'. Until
# then, pushes just build+push images (harmless) and the VPS is left alone. Flip the
# variable (repo → Settings → Variables → Actions) to arm auto-deploy. workflow_dispatch
# with a `sha` input re-deploys any past build — that is also the rollback path.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "bench/**"
      - "pipeline/**"
      - "extraction/**"
      - "db/**"
      - "docker-compose*.yml"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to (re)deploy — blank = latest commit on kssl-deploy"
        required: false

concurrency:
  group: deploy-vps-b
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        run: echo "sha=${{ github.event.inputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: backend
            context: .
            dockerfile: ./backend/Dockerfile
          - service: extraction
            context: ./extraction
            dockerfile: ./extraction/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/137mallory/kssl-deploy/${{ matrix.service }}:${{ needs.resolve.outputs.sha }}
            ghcr.io/137mallory/kssl-deploy/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    # Armed only when the operator flips DEPLOY_ENABLED. Off = build images but never touch the VPS.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Sync source + recreate frontend/backend
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
          GHTOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          install -m600 /dev/stdin "$HOME/dk" <<< "$SSH_KEY"
          SSH="ssh -i $HOME/dk -o StrictHostKeyChecking=accept-new -p $PORT"
          # source in lockstep with the image; never delete VPS-only runtime files (.env, PRODUCTION.html)
          rsync -az \
            --exclude='.git' --exclude='node_modules' --exclude='frontend/dist' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' --exclude='*.env' \
            --exclude='*.log' --exclude='*.sqlite*' \
            -e "$SSH" ./ "$USER@$HOST:/opt/kssl/app/"
          $SSH "$USER@$HOST" \
            "echo '$GHTOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin \
             && cd /opt/kssl/app && chmod +x deploy/deploy.sh && ./deploy/deploy.sh '$SHA' \
             && docker logout ghcr.io"
