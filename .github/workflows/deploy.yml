name: Deploy

# THREE ENVIRONMENTS, ONE WORKFLOW. The branch decides the machine:
#
#   main     -> prod     VPS-B          authoritative data, the extraction fleet
#   staging  -> staging   VPS-A         replica data, small fleet
#   dev      -> dev       data centre   replica data, one worker per farm
#
# Host, user, port and key come from a GitHub *Environment* of the same name, so the same
# steps deploy to a different machine with no branching in the script. DEPLOY_ENABLED is
# still consulted for prod only -- staging and dev are the whole point of being able to
# deploy freely, and neither one can reach production's data.
#
# Push to kssl-deploy → build+push SHA-pinned images to GHCR. The deploy to the target then
# rsyncs the exact commit's source (compose, db/*.sql, deploy/) and recreates ONLY
# frontend+backend from GHCR — the extraction farm and DB/LLM containers are never touched.
#
# SAFETY: the PRODUCTION deploy only runs when the repo variable DEPLOY_ENABLED == 'true'.
# Until then a push to main just builds and pushes images (harmless) and VPS-B is left
# alone. Flip the variable (repo → Settings → Variables → Actions) to arm it.
# workflow_dispatch with a `sha` input re-deploys any past build — that is the rollback path.
on:
  push:
    branches: [main, staging, dev]
    paths:
      - "frontend/**"
      - "backend/**"
      - "bench/**"
      - "pipeline/**"
      - "extraction/**"
      - "db/**"
      - "docker-compose*.yml"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to (re)deploy — blank = latest commit on kssl-deploy"
        required: false

concurrency:
  # Per branch, so a staging deploy never queues behind a production one.
  group: deploy-${{ github.ref_name }}
  # SUPERSEDED NON-PRODUCTION DEPLOYS ARE CANCELLED; A PRODUCTION ONE IS NEVER TOUCHED.
  #
  # Measured over 2026-09-01..07: 18 of 150 Deploy runs were still going when a newer run
  # on the same branch started -- work that could not reach a machine, because this same
  # concurrency group makes the newer run wait for it. Cancelling those is free.
  #
  # It is NOT free on main. A deploy killed between the rsync and the health gate leaves
  # production with this commit's source tree, the previous commit's containers, and no
  # gate having run -- the one state deploy.sh's rollback cannot reason about, because
  # rollback happens INSIDE the run being cancelled. So main keeps the old behaviour and
  # queues. On staging and dev the same interruption is recoverable by re-running, which
  # is what those environments are for.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    # RESOLVE CANNOT USE `needs.resolve.outputs.runner` -- it is the job that computes it.
    # So the branch -> runner mapping is spelled out once more here, and only here. The
    # two must agree; test_runner_paths.py asserts they do, because a drift would put
    # this job on a GitHub runner while everything downstream waited on a self-hosted one.
    #
    # Same two variables, same default: unset (or anything but 'true') is ubuntu-latest,
    # which is the ssh path and the state this repository is in today.
    runs-on: ${{ fromJSON(
      (github.ref_name == 'main'    && vars.SELF_HOSTED_PROD    == 'true' && '["self-hosted","prod"]')
      || (github.ref_name == 'staging' && vars.SELF_HOSTED_STAGING == 'true' && '["self-hosted","staging"]')
      || '["ubuntu-latest"]') }}
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      env: ${{ steps.pick.outputs.env }}
      # A JSON array, consumed by the deploy job as `runs-on: ${{ fromJSON(...) }}`.
      # Emitted here so the branch -> environment -> machine mapping stays in ONE case
      # statement; a second copy in an inline `runs-on` expression is how the two drift.
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the ancestry check below needs history, not one commit
      - id: pick
        run: |
          echo "sha=${{ github.event.inputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"
          # WHICH MACHINE RUNS THE DEPLOY, not just which machine it targets.
          #
          # prod and staging deploy FROM the box they deploy TO: a runner installed on
          # VPS-B and VPS-A respectively, which makes the deploy a local operation and
          # removes the inbound ssh the old path needed. dev has no runner (it lives in
          # the data centre) and keeps the ssh path, which is why both paths still exist
          # in the deploy job below.
          #
          # The label pair is also the first of the two wrong-environment guards: GitHub
          # will only hand this job to a runner registered with BOTH labels, so the
          # staging runner is not eligible for a prod job at all. The second guard is the
          # .KSSL_ENV marker check, which runs on the machine itself.
          # EACH ENVIRONMENT IS ARMED SEPARATELY, and the default is the old ssh path.
          #
          # A job asking for `[self-hosted, prod]` when no runner carries those labels does
          # not fail -- it QUEUES, for up to 24 hours, looking exactly like a slow deploy.
          # So merging this file cannot be what switches production over: the runners have
          # to exist first, and staging has to have proved the path before prod tries it.
          #
          # Same shape as DEPLOY_ENABLED, which this repository already uses for the
          # production gate: flip a repo variable (Settings -> Variables -> Actions) once
          # that environment's runner reads "Idle". Unset or anything but 'true' keeps the
          # ssh path, so a runner that is uninstalled, unreachable or mid-rebuild is one
          # variable away from being routed around.
          case "${{ github.ref_name }}" in
            main)    echo "env=prod"    >> "$GITHUB_OUTPUT"
                     if [ "${{ vars.SELF_HOSTED_PROD }}" = "true" ]; then
                       echo 'runner=["self-hosted","prod"]' >> "$GITHUB_OUTPUT"
                     else
                       echo 'runner=["ubuntu-latest"]'      >> "$GITHUB_OUTPUT"
                     fi ;;
            staging) echo "env=staging" >> "$GITHUB_OUTPUT"
                     if [ "${{ vars.SELF_HOSTED_STAGING }}" = "true" ]; then
                       echo 'runner=["self-hosted","staging"]' >> "$GITHUB_OUTPUT"
                     else
                       echo 'runner=["ubuntu-latest"]'         >> "$GITHUB_OUTPUT"
                     fi ;;
            dev)     echo "env=dev"     >> "$GITHUB_OUTPUT"
                     echo 'runner=["ubuntu-latest"]'         >> "$GITHUB_OUTPUT" ;;
            *)       echo "env=none"    >> "$GITHUB_OUTPUT"
                     echo 'runner=["ubuntu-latest"]'         >> "$GITHUB_OUTPUT" ;;
          esac
          echo "runner: $(grep '^runner=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"

      # A DISPATCHED SHA MUST BE ON THE BRANCH IT DEPLOYS.
      #
      # `sha` is the rollback path -- redeploy a past build without a revert commit -- and
      # it was accepted as typed. Any commit object the repository can reach qualified: a
      # commit from another branch, from an unmerged pull request, or from a fork whose
      # objects GitHub keeps. Dispatch on `main` with one of those and code that was never
      # reviewed, never merged and never on main is built, pushed to GHCR and rsynced onto
      # VPS-B, under a run that reports as a production deploy of main.
      #
      # Rollback is unaffected: an earlier commit ON this branch is an ancestor of its tip.
      # This is the enforceable half of the production gate -- required reviewers on the
      # prod Environment need a paid plan, an ancestry check needs nothing.
      - name: A dispatched SHA must be an ancestor of this branch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sha != ''
        env:
          WANT: ${{ github.event.inputs.sha }}
        run: |
          if ! git cat-file -e "$WANT^{commit}" 2>/dev/null; then
            echo "::error::$WANT is not a commit in this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$WANT" HEAD; then
            echo "::error::$WANT is not an ancestor of ${{ github.ref_name }} ($(git rev-parse --short HEAD))."
            echo "::error::Only commits already on this branch may be deployed to it. Merge it first."
            exit 1
          fi
          echo "$WANT is on ${{ github.ref_name }} — redeploying it"


  # The self-checks gate the DEPLOY, not just a pull request. ci.yml runs on pull_request
  # only, and this repository is pushed to directly -- so until this job existed, every
  # commit that reached production had been built but never tested. The same hermetic
  # checks run here as in ci.yml; a PR is gated by that one, a direct push by this one,
  # and neither route reaches a machine without them.
  #
  # `needs: resolve` is not ordering, it is the gate. Without it this job ran CONCURRENTLY
  # with the ancestry check and checked out the dispatched sha directly -- so an unmerged
  # commit's code executed on the runner (pip install, then its own test_*.py) under the
  # workflow's packages:write GITHUB_TOKEN, which actions/checkout persists into
  # .git/config. That token can overwrite the GHCR tags rollback depends on. Gating only
  # `build` and `deploy` left the arbitrary code running anyway.
  selfcheck:
    needs: resolve
    # Follows resolve, so the whole workflow lands on one environment's runner or none of
    # it does. These checks are hermetic -- no database, no network beyond pip, no model
    # call -- so running them on the deploy target costs it nothing but CPU.
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A SELF-HOSTED RUNNER'S TOOL CACHE OUTLIVES THE JOB, AND THIS JOB pip-INSTALLS.
      #
      # deploy/selfcheck.sh opens with `pip install -r extraction/requirements.txt`. On
      # GitHub's disposable machines that lands in a Python thrown away minutes later. On
      # a runner that persists, it lands in the tool cache and STAYS -- so a requirement
      # deleted from requirements.txt would go on being importable, and the gate whose
      # entire job is catching that would pass. A stale package masking a missing
      # dependency is the exact failure this script exists to prevent.
      #
      # $RUNNER_TEMP is cleared between jobs on both kinds of runner, so a venv there is
      # empty every run. Prepending it to $GITHUB_PATH makes the `python` and `pip` that
      # selfcheck.sh calls resolve to it, with no change to the script -- which ci.yml
      # also calls, and which should stay one script.
      - name: Fresh venv, so a persistent runner cannot fake a passing gate
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Extraction + serving self-checks
        run: |
          echo "python: $(command -v python)  ($(python -V))"
          bash deploy/selfcheck.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The frontend half of the same gate. It ran in ci.yml and nowhere else, so a direct
      # push -- the route production takes -- deployed a frontend that no test had touched.
      # test_tender_row.mjs compiles the .jsx it asserts over with esbuild, so the loop
      # needs node_modules even though most of these are plain node over src/lib.
      - name: Frontend regression tests
        working-directory: frontend
        run: |
          npm ci
          fail=0
          for t in test_*.mjs; do
            echo "== $t"
            node "$t" || fail=1
          done
          exit $fail

  build:
    needs: resolve
    # Builds on the machine that will run the images, which is also what keeps the two
    # environments apart: a staging build never touches VPS-B. Both boxes are x86_64, the
    # same architecture ubuntu-latest was producing, so the images are unchanged.
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: backend
            context: .
            dockerfile: ./backend/Dockerfile
          - service: extraction
            context: ./extraction
            dockerfile: ./extraction/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/137mallory/kssl-deploy/${{ matrix.service }}:${{ needs.resolve.outputs.sha }}
            ghcr.io/137mallory/kssl-deploy/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [resolve, build, selfcheck]
    # THE DEPLOY RUNS ON THE MACHINE IT DEPLOYS TO (prod, staging), or on a GitHub runner
    # over ssh (dev). `resolve` picks; see the case statement there.
    #
    # THIS WORKFLOW IS SAFE TO PUT ON A SELF-HOSTED RUNNER AND ci.yml IS NOT, and the
    # difference is the trigger, not the steps. Deploy fires only on `push` to
    # main/staging/dev and on workflow_dispatch -- both of which require write access to
    # this repository. ci.yml fires on `pull_request`, which a stranger's fork can open,
    # so it stays on GitHub's disposable machines where arbitrary code is meant to run.
    # Never add a pull_request trigger to this file.
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner) }}
    # A DEPLOY THAT HANGS IS STOPPED; A DEPLOY THAT CANNOT START IS NOT, AND THE
    # DIFFERENCE MATTERS -- do not read this as a queue timeout, because it is not one.
    #
    # timeout-minutes is measured from the moment a runner picks the job up. It bounds a
    # `compose pull` against a stalled registry or a health gate waiting on a container
    # that never settles; the ssh path bounded neither. It does NOT bound the time spent
    # WAITING for a runner: GitHub gives a queued job 24 hours and offers no per-job
    # setting to shorten it. There is no workflow-level fix for that, so the control is
    # upstream -- SELF_HOSTED_PROD / SELF_HOSTED_STAGING in `resolve`. An environment
    # whose runner is gone is un-armed, and the very next run takes the ssh path with no
    # revert and no redeploy. See deploy/RUNNERS.md.
    #
    # 30 minutes: the slowest real deploy in this repository's history is well under 10.
    timeout-minutes: 30
    # Production stays gated behind DEPLOY_ENABLED. Staging and dev deploy on every push --
    # that is what they are for, and neither can reach production's data.
    if: needs.resolve.outputs.env != 'none' && (needs.resolve.outputs.env != 'prod' || vars.DEPLOY_ENABLED == 'true')
    environment: ${{ needs.resolve.outputs.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      # WRONG-ENVIRONMENT GUARD, SELF-HOSTED PATH. Same question as the ssh version
      # below -- "is this machine the environment being deployed?" -- asked of the local
      # filesystem, because on a self-hosted runner there is no remote to ask.
      #
      # This is the SECOND of the two guards. The first is the label pair in `runs-on`:
      # GitHub only dispatches a `[self-hosted, prod]` job to a runner registered with
      # both labels, so the staging runner is never offered it. This one covers the case
      # the labels cannot -- a runner registered with the wrong label by hand -- and it
      # runs BEFORE the rsync, which is the whole point: deploy.sh has the same check,
      # but by the time deploy.sh runs the tree has already been written over.
      - name: This runner must be the environment being deployed
        if: runner.environment == 'self-hosted'
        env:
          KENV: ${{ needs.resolve.outputs.env }}
        run: |
          MARK="$(tr -d '[:space:]' < /opt/kssl/app/.KSSL_ENV 2>/dev/null || true)"
          if [ -n "$MARK" ] && [ "$MARK" != "$KENV" ]; then
            echo "::error::This runner's machine is provisioned as '$MARK' but this is a"
            echo "::error::'$KENV' deploy. The runner carries the wrong label. Nothing was"
            echo "::error::transferred. Re-register it with the '$MARK' label."
            exit 1
          fi
          if [ -z "$MARK" ] && [ "$KENV" != "prod" ]; then
            echo "::error::This machine carries no /opt/kssl/app/.KSSL_ENV, so it is not a"
            echo "::error::provisioned '$KENV' host. Nothing was transferred."
            exit 1
          fi
          echo "runner: $(hostname) · marker '${MARK:-none}' — ok for a $KENV deploy"
          echo "labels: ${{ join(fromJSON(needs.resolve.outputs.runner), ', ') }}"

      # DEPLOY WITHOUT LEAVING THE BOX. No ssh, no key on disk, no inbound connection --
      # the runner already holds the checkout, and the target is its own filesystem.
      # deploy.sh is byte-for-byte the script the ssh path invokes, so the health gate,
      # the image pin and the rollback are unchanged; only the transport is gone.
      - name: Sync source + recreate frontend/backend (local)
        if: runner.environment == 'self-hosted'
        env:
          GHTOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ needs.resolve.outputs.sha }}
          KENV: ${{ needs.resolve.outputs.env }}
        run: |
          # Same exclude list as the ssh path, and it must stay the same list: '/*.env' is
          # anchored to the transfer root so deploy/envs/*.env survive, and /.KSSL_ENV is
          # the host identity marker the guard above just read.
          # No -z: compressing a copy between two directories on one disk only costs CPU.
          rsync -a \
            --exclude='.git' --exclude='node_modules' --exclude='frontend/dist' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' --exclude='/*.env' \
            --exclude='*.log' --exclude='*.sqlite*' \
            --exclude='/.KSSL_ENV' \
            ./ /opt/kssl/app/
          echo "$GHTOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          cd /opt/kssl/app
          chmod +x deploy/deploy.sh
          # Log out whatever happens, then report deploy.sh's own exit code -- an
          # ephemeral registry token must not outlive the run that minted it.
          ./deploy/deploy.sh "$SHA" "$KENV"; rc=$?
          docker logout ghcr.io >/dev/null 2>&1 || true
          exit $rc

      # --- THE SSH PATH, KEPT ------------------------------------------------------
      # Still the only path for dev, and still the fallback for prod and staging: flip a
      # `runs-on` back to ubuntu-latest in `resolve` and these two steps take over again
      # with nothing else changed. It stays until the self-hosted path has deployed both
      # environments successfully.
      # THE GUARD HAS TO RUN BEFORE THE RSYNC, NOT INSIDE deploy.sh.
      #
      # deploy.sh's host check is the last line of defence and it is real, but by the time
      # it runs the step below has ALREADY rsynced this branch's tree over
      # /opt/kssl/app -- db/, deploy/, the compose files, and the ../db bind mount the
      # migrate role reads. So a push to `staging` or `dev`, whose Environments carry no
      # secrets of their own and fall back to the repository's (which point at VPS-B),
      # overwrites PRODUCTION's source tree with an older branch and only then gets
      # refused. The deploy reports failure, which is right, and production's checkout is
      # silently a different commit, which is not. That is the 2026-09-03 incident the
      # .gitignore comment records, and it is not fixed by a marker deploy.sh reads too
      # late.
      #
      # Same logic as deploy.sh, asked over ssh first: a marker that disagrees is refused,
      # an absent marker is prod-only. Nothing is written and nothing is transferred.
      - name: This host must be the environment being deployed
        if: runner.environment != 'self-hosted'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
          KENV: ${{ needs.resolve.outputs.env }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::The '$KENV' Environment has no VPS_HOST. Refusing to fall back."
            exit 1
          fi
          install -m600 /dev/stdin "$HOME/dk" <<< "$SSH_KEY"
          SSH="ssh -i $HOME/dk -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p $PORT"
          # AN EMPTY MARKER HAS TWO CAUSES AND THEY ARE NOT THE SAME FAULT.
          #
          # The remote command ends in `|| true`, so ssh exits non-zero only when the
          # CONNECTION failed. Folding that into "the marker is empty" made every
          # unreachable host report as "the Environment fell back to the repository
          # secrets" -- a configuration error, naming settings that were correct. The
          # staging deploy sat on that message while the real fault was that the runner
          # could not open a socket to the box at all.
          # RETRY BEFORE DIAGNOSING, because one dropped SYN is not an outage.
          #
          # Measured 2026-09-06 with the ssh-check workflow against PRODUCTION, five
          # dispatches minutes apart: four connected, one had its SYN silently dropped
          # for the full 10s timeout. Same secrets, same workflow, different runner IP --
          # the provider's edge does not admit every GitHub range every time. A single
          # attempt therefore fails roughly one deploy in five, and it fails at the
          # preflight, so the log says "could not reach the host" about a host that is
          # up and that the next run reaches.
          #
          # Three tries with a widening gap, not a loosened firewall: the fix for an
          # intermittent drop is to tolerate it, not to open the box to more of the
          # internet. Only the LAST failure is diagnosed, so a recovered blip is silent.
          SSH_OK=0
          for attempt in 1 2 3; do
            if $SSH "$USER@$HOST" true 2>"$HOME/ssherr"; then
              [ "$attempt" -gt 1 ] && echo "ssh reachable on attempt $attempt"
              SSH_OK=1
              break
            fi
            [ "$attempt" -lt 3 ] && { echo "ssh attempt $attempt failed, retrying"; sleep $((attempt * 15)); }
          done
          if [ "$SSH_OK" = 0 ]; then
            echo "::error::Could not reach $USER@$HOST port $PORT over ssh. This is NOT a"
            echo "::error::secrets problem: VPS_HOST is set and was used. Nothing was transferred."
            sed 's/^/::error::ssh: /' "$HOME/ssherr"
            # SAY WHICH OF THE THREE IT IS. "Connection timed out" is the same string
            # for a host that does not resolve, a host that resolves but drops packets,
            # and a port nothing listens on -- three different fixes. The checklist
            # below used to leave the operator to work out which, and on 2026-09-06
            # that cost a morning: the box was up, sshd was on 22, the host firewall
            # was not merely permissive but absent (ufw inactive, no nftables rule),
            # and the box was logging inbound ssh from the public internet the whole
            # time. Nothing on the checklist was wrong; the secret simply did not point
            # at that box. These probes cannot say what VPS_HOST is -- it is masked in
            # the log, and printing its resolved address would unmask it -- but they
            # can say which layer failed, which is what narrows it.
            if getent hosts "$HOST" >/dev/null 2>&1; then
              echo "::error::DNS: VPS_HOST resolves."
              if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
                # ACCEPTING A CONNECTION IS NOT THE SAME AS ANSWERING IT, and the
                # difference is the whole diagnosis. This branch used to conclude
                # "ssh-level (host key, or sshd refusing this user/key)" from the TCP
                # connect alone. That inference is impossible: sshd sends its version
                # banner BEFORE it looks at a host key or a user, so a refusal always
                # arrives after "SSH-2.0-...". A reset with ZERO bytes cannot be sshd
                # refusing anything -- it is a listener with no ssh service behind it.
                # On 2026-09-06 that wrong sentence sent the staging investigation at
                # sshd config and keys for hours while the box was accepting on 2222
                # and answering nothing, and serving HTTP on :80 the whole time.
                #
                # So read the banner and let it decide. `head -c` returns as soon as
                # the peer closes, and the timeout covers a peer that just holds on.
                BANNER="$(timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/$PORT; head -c 20 <&3" 2>/dev/null | tr -dc '\40-\176')"
                if [ -z "$BANNER" ]; then
                  echo "::error::TCP: port $PORT accepts, then closes WITHOUT AN SSH BANNER."
                  echo "::error::That is not sshd rejecting this key -- sshd always greets first."
                  echo "::error::Something is bound to the port with no working ssh behind it:"
                  echo "::error::a socket unit whose per-connection service fails, a stale"
                  echo "::error::docker port-publish for a stopped container, or a non-ssh"
                  echo "::error::service. Fix it ON THE HOST; no key or workflow change helps."
                elif [ "${BANNER#SSH-}" != "$BANNER" ]; then
                  echo "::error::TCP: port $PORT answers with an ssh banner ($BANNER), so this"
                  echo "::error::IS ssh-level: host key, this user/key, or a rate limit."
                else
                  echo "::error::TCP: port $PORT answers, but not with an ssh banner. Something"
                  echo "::error::other than sshd is listening, or VPS_SSH_PORT is the wrong port."
                fi
              else
                echo "::error::TCP: port $PORT does NOT accept a connection from this runner,"
                echo "::error::while DNS resolves. So the address is routable but the port is"
                echo "::error::filtered or closed: a cloud-provider firewall or security group"
                echo "::error::in front of the box (the box's OWN firewall is a separate"
                echo "::error::thing and may well be inactive), or VPS_SSH_PORT is not the"
                echo "::error::port sshd uses, or VPS_HOST points at a different machine."
              fi
            else
              echo "::error::DNS: VPS_HOST does NOT resolve. It is a stale hostname or a typo;"
              echo "::error::no firewall or port change will fix it."
            fi
            exit 1
          fi
          MARK="$($SSH "$USER@$HOST" 'cat /opt/kssl/app/.KSSL_ENV 2>/dev/null || true' | tr -d '[:space:]')"
          if [ -n "$MARK" ] && [ "$MARK" != "$KENV" ]; then
            echo "::error::$HOST is provisioned as '$MARK' but this is a '$KENV' deploy. Nothing was transferred."
            echo "::error::Set VPS_HOST/VPS_USER/VPS_SSH_KEY on the '$KENV' GitHub Environment."
            exit 1
          fi
          if [ -z "$MARK" ] && [ "$KENV" != "prod" ]; then
            echo "::error::$HOST carries no .KSSL_ENV, so it is not a provisioned '$KENV' host."
            echo "::error::That means the '$KENV' Environment fell back to the REPOSITORY secrets,"
            echo "::error::which point at production. Nothing was transferred."
            exit 1
          fi
          echo "host marker: '${MARK:-none}' — ok for a $KENV deploy"

      - name: Sync source + recreate frontend/backend
        if: runner.environment != 'self-hosted'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
          GHTOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ needs.resolve.outputs.sha }}
          KENV: ${{ needs.resolve.outputs.env }}
        run: |
          install -m600 /dev/stdin "$HOME/dk" <<< "$SSH_KEY"
          SSH="ssh -i $HOME/dk -o StrictHostKeyChecking=accept-new -p $PORT"
          # Source in lockstep with the image; never delete VPS-only runtime files (.env,
          # PRODUCTION.html). .KSSL_ENV is a HOST identity marker written by
          # provision_env.sh / deploy.sh -- it names which machine this is, so shipping one
          # box's copy to every box would either lock a host out (exit 5) or, worse, tell a
          # host it is something it is not. It is excluded here and gitignored.
          # NOTE the exclude is '/*.env', anchored to the transfer root --
          # a bare '*.env' also matches deploy/envs/{prod,staging,dev}.env, and without those
          # files deploy.sh exits with "no such environment" on every host.
          rsync -az \
            --exclude='.git' --exclude='node_modules' --exclude='frontend/dist' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' --exclude='/*.env' \
            --exclude='*.log' --exclude='*.sqlite*' \
            --exclude='/.KSSL_ENV' \
            -e "$SSH" ./ "$USER@$HOST:/opt/kssl/app/"
          # `; rc=$?; logout; exit $rc` rather than `&& docker logout`: deploy.sh can now
          # exit non-zero (a failed extraction recreate is no longer swallowed), and with
          # `&&` that leaves the ephemeral registry token sitting in the host's
          # ~/.docker/config.json until it expires. Log out either way, keep the real code.
          $SSH "$USER@$HOST" \
            "echo '$GHTOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin \
             && cd /opt/kssl/app && chmod +x deploy/deploy.sh \
             && { ./deploy/deploy.sh '$SHA' '$KENV'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc; }"
