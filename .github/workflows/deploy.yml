name: Deploy to VPS-B

# Push to kssl-deploy → build+push SHA-pinned images to GHCR → SSH deploy (frontend+backend
# only; the extraction farm and DB/LLM containers are never touched). workflow_dispatch with
# a `sha` input re-deploys any past build — that is also the rollback path.
on:
  push:
    branches: [kssl-deploy]
    paths:
      - "frontend/**"
      - "backend/**"
      - "pipeline/**"
      - "db/**"
      - "docker-compose*.yml"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to (re)deploy — blank = latest commit on kssl-deploy"
        required: false

concurrency:
  group: deploy-vps-b
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        run: echo "sha=${{ github.event.inputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: backend
            context: .
            dockerfile: ./backend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/137mallory/kssl-${{ matrix.service }}:${{ needs.resolve.outputs.sha }}
            ghcr.io/137mallory/kssl-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (frontend + backend only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/kssl/app
            ./deploy/deploy.sh ${{ needs.resolve.outputs.sha }}
            docker logout ghcr.io
