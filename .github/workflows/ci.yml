name: CI

# Gates on every PR into kssl-deploy: the images must build (the Vite build is the real
# frontend gate; the backend image build validates its deps), backend lints clean, and the
# hermetic pipeline self-tests pass. No deploy, no registry push — that is deploy.yml's job.
on:
  # Every promotion step is a PR, so all three targets gate the same way:
  #   feature -> dev -> staging -> main
  pull_request:
    branches: [main, staging, dev]
  # ...and on the push itself, because this repository is ALSO pushed to directly. Until
  # this trigger existed, ci.yml ran on no commit that ever reached a machine -- including
  # the schema job, which is exactly the check that catches a migration whose result does
  # not match db/schema_snapshot.txt. Being required by branch protection needs it to have
  # run; it cannot be required while it never runs.
  push:
    branches: [main, staging, dev]

# A NEWER PUSH MAKES THE OLDER RUN'S ANSWER WORTHLESS, SO STOP PAYING FOR IT.
#
# ci.yml had no concurrency group at all: every push started a fresh run and every older
# run on the same branch carried on to completion. Measured over 2026-09-01..07, 10 of
# 172 CI runs were still going when their successor started -- pure waste, because a
# green tick on a commit that is no longer the tip gates nothing.
#
# Safe here in a way it is NOT safe in deploy.yml: these jobs build images to a local
# daemon, run tests and diff a schema snapshot. None of them writes to a machine, a
# registry or a database, so a cancelled run leaves nothing half-done. The deploy
# workflow makes the opposite call for main, and says why.
#
# Grouped by PULL REQUEST where there is one, and by ref otherwise: `pull_request` runs
# carry the merge ref, so grouping on github.ref alone would let a push and its PR run
# cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # WHERE THIS WORKFLOW RUNS, decided once for all four jobs.
  #
  # deploy.yml has routed its jobs to the machine they deploy to since 2026-09-07. ci.yml
  # stayed on ubuntu-latest and was then the ONLY thing in this repository still spending
  # GitHub-hosted minutes -- which is why every run since has ended in "the job was not
  # started because recent account payments have failed or your spending limit needs to be
  # increased". The gates were not failing. They were not running at all, and a required
  # check that never runs gates nothing.
  #
  # CI has no environment of its own, so it borrows STAGING's runner. Never prod's: GitHub
  # only offers a `[self-hosted, staging]` job to a runner registered with BOTH labels, and
  # the production runner carries `prod`, so a CI job is not eligible for the production box
  # at all. The second step below covers the one case labels cannot -- a runner labelled by
  # hand -- because CI builds images and starts a postgres service container, and neither
  # belongs on the machine serving production.
  resolve:
    # RESOLVE CANNOT USE ITS OWN OUTPUT -- it is the job that computes it. So the condition
    # is spelled out here and once more in the script below, the same duplication deploy.yml
    # carries and for the same reason: without it this job lands on a GitHub runner while
    # everything downstream waits on a self-hosted one, and the billing block takes the
    # workflow down at the first job instead of none of them.
    runs-on: ${{ fromJSON(
      (vars.SELF_HOSTED_CI == 'true'
       && github.event.repository.private
       && (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository))
      && '["self-hosted","staging"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      # A JSON array, consumed by every other job as `runs-on: ${{ fromJSON(...) }}`.
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        # THREE CONDITIONS, AND ALL THREE MUST HOLD.
        #
        # 1. vars.SELF_HOSTED_CI == 'true' -- the arming switch, the same pattern as
        #    SELF_HOSTED_PROD / SELF_HOSTED_STAGING. Unset it in repository variables and
        #    the very next run is back on ubuntu-latest with no commit and no PR. That is
        #    the reason the hosted path below is kept rather than deleted.
        #
        # 2. The repository is PRIVATE. A self-hosted runner executes whatever the workflow
        #    file says, on a machine we own, and `run:` is arbitrary code. On a public
        #    repository a stranger opens a pull request and that code is theirs. This is
        #    read off the event payload rather than a variable precisely so that making the
        #    repository public disarms it on its own, with nobody having to remember.
        #
        # 3. The pull request comes from THIS repository, not a fork. A private repository
        #    can still be forked by anyone granted access (allow_forking is on here), and a
        #    fork's branch is a branch we did not write.
        #
        # Failing any of the three falls back to ubuntu-latest. While billing is blocked
        # that is a failed run rather than a skipped one -- which is the right answer for a
        # pull request we have not decided to trust, and a visible one.
        run: |
          sh=0
          if [ "${{ vars.SELF_HOSTED_CI }}" = "true" ] \
             && [ "${{ github.event.repository.private }}" = "true" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ] \
               || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              sh=1
            fi
          fi
          if [ "$sh" = 1 ]; then
            echo 'runner=["self-hosted","staging"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["ubuntu-latest"]'         >> "$GITHUB_OUTPUT"
          fi
          echo "runner: $(grep '^runner=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"

      - name: CI must not land on the production box
        if: runner.environment == 'self-hosted'
        run: |
          MARK="$(cat /opt/kssl/app/.KSSL_ENV 2>/dev/null || true)"
          if [ "$MARK" != "staging" ]; then
            echo "::error::This runner's machine is provisioned as '${MARK:-unknown}', not"
            echo "::error::staging. CI builds three images and starts a postgres service"
            echo "::error::container; it has no business on that box. A runner is carrying"
            echo "::error::the wrong labels. Nothing was built."
            exit 1
          fi
          echo "runner: $(hostname) · marker '$MARK' — ok for CI"

  build-images:
    # PRs only. deploy.yml builds and PUSHES the same three images on every push to
    # main/staging/dev, so running this there too builds each image twice against the
    # same gha cache scope for no extra signal.
    if: github.event_name == 'pull_request'
    needs: resolve
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner) }}
    # A self-hosted runner is a single machine and these jobs queue behind each other on
    # it. timeout-minutes is counted from the moment the job is PICKED UP, not from when it
    # was queued, so this bounds a hung build and not a wait -- but a hung build on a
    # persistent runner blocks every other job in the repository, deploys included, which
    # is why it is bounded here and was not worth bounding on a disposable VM.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: backend
            context: .
            dockerfile: ./backend/Dockerfile
          - service: extraction
            context: ./extraction
            dockerfile: ./extraction/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  schema:
    # The schema files must build the database they claim to describe. Before this job,
    # db/*.sql was eleven columns and a table behind production -- every one of them
    # added by a hand-applied ALTER over ssh that no file recorded.
    needs: resolve
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner) }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kssl
          POSTGRES_DB: kssl
        # 55432, NOT 5432, and bound to loopback. On a disposable VM the throwaway port
        # number did not matter. On the staging box it matters twice over: a native
        # postgres already holds 127.0.0.1:5432, so publishing on 5432 fails to bind and
        # takes the job with it -- and had it bound, `psql "$DSN"` would have applied
        # db/[0-9][0-9]_*.sql straight into the live staging database instead of into a
        # throwaway container. The explicit 127.0.0.1 keeps a password of 'kssl' off the
        # public interface of an internet-facing machine for the length of the job.
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DSN: postgresql://postgres:kssl@127.0.0.1:55432/kssl
    steps:
      - uses: actions/checkout@v4
      - name: Apply the base schema in filename order
        # Base files only, which is what a new database gets: each migration's effect
        # is folded back into these files in the same commit that adds the migration,
        # so replaying migrations here would double-apply them.
        # ponytail: this does not replay migrations against the previous schema, so a
        # broken migration is caught by the runner's transaction at deploy time rather
        # than here. Worth building if one ever lands badly.
        #
        # The glob is [0-9][0-9]_*.sql, the SAME one extraction/entrypoint.sh applies, not
        # db/*.sql. db/ also holds sanitise_replica.sql, which is a DELETE run against a
        # restored replica -- a bare *.sql glob would apply it here as if it were schema.
        run: |
          for f in db/[0-9][0-9]_*.sql; do
            echo "-- $f"
            psql "$DSN" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: The result must match db/schema_snapshot.txt
        run: |
          ./db/schema_snapshot.sh "$DSN" > /tmp/actual.txt
          # A schema change is fine; a schema change that was not snapshotted is not.
          # Regenerate with:  db/schema_snapshot.sh "$KSSL_DSN" > db/schema_snapshot.txt
          diff -u db/schema_snapshot.txt /tmp/actual.txt

      - name: The replica sanitise must still match that schema
        # db/sanitise_replica.sql is what keeps the client's own pages off a QA box. It is
        # a DELETE whose predicate is a regex against columns this schema defines, so it
        # rots the moment a column moves -- and a regex that silently matches nothing
        # looks exactly like a clean database. The test plants rows it must remove, rows
        # it must keep, and one only its own guard can catch.
        run: ./db/test_sanitise_replica.sh "$DSN"

  lint-and-test:
    needs: resolve
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (backend + pipeline)
        run: |
          pip install ruff
          ruff check backend pipeline || true   # advisory until the tree is clean
      - name: Hermetic pipeline self-test
        run: |
          pip install httpx psycopg2-binary
          python pipeline/fetch_tenders.py --demo

      # THE BACKEND SUITE, FOUND BY DIRECTORY RATHER THAN NAMED FILE BY FILE.
      #
      # Naming them is how this job came to run a test that is not on this branch. ci.yml
      # was brought onto staging by 1bd9d1d carrying main's step list, and the two files
      # those steps run arrived on main in 391d16c, which staging does not have -- so
      # every run ended in `python: can't open file .../backend/test_patent_fields.py`.
      # That is not a gate failing. It is a gate that cannot run, and it stops the two
      # steps behind it from running either.
      #
      # It cuts the other way too: main carries backend/test_lineage.py and
      # backend/test_ops.py and names neither, so two working suites gate nothing at all.
      # Same rot, and the same fix, as the frontend loop below -- a backend test should be
      # picked up by being written, not by also remembering to edit this file.
      #
      # What the files in that directory gate today. None of them needs a database; each
      # builds the cursor or the payload it asserts on.
      #
      #   test_optional_columns.py -- deploy.sh runs no migrations, on any environment;
      #     sync_from_prod.sh is the only thing that does, and says so itself. So a commit
      #     that adds a column to a backend field list AND ships its migration puts a
      #     backend that selects that column in front of a database without it on the very
      #     next deploy. The competitors query is the first one in _dataset, so that is not
      #     a missing field, it is 500 for GET /api/dataset and a blank dashboard. It
      #     happened on staging on 2026-09-06 with `country`.
      #
      #   test_patent_fields.py -- the other half of that seam. The one above proves a
      #     backend AHEAD of its database loses one field instead of the dashboard; this
      #     proves a backend BEHIND its database is not silently serving nothing.
      #     serving.patent has carried published, grant_no, pub_kind and doc_id since
      #     2026-09-06 and PATENT_FIELDS -- which is the SELECT -- named none of them, so
      #     four measured columns could not reach the browser and the tab looked exactly
      #     like a harvest that had not run. It reads db/migrations/*.sql rather than a
      #     hand-written list, so the next column added to that table has to be wired up
      #     or it goes red on its own.
      #
      #   test_severity_serve.py -- severity is derived on the response, so the API is the
      #     only place it can be wrong. It checks the grade AND the call site: a unit test
      #     that calls _grade_cards directly passes happily against a _dataset that
      #     assembles the payload and ships it ungraded, which is a dashboard whose feed
      #     silently loses its ordering key.
      - name: Backend regression tests
        run: |
          pip install fastapi
          found=0
          fail=0
          for t in backend/test_*.py; do
            # An unmatched glob is left literal by bash, so this is the empty directory.
            [ -e "$t" ] || continue
            found=$((found + 1))
            echo "== $t"
            python "$t" || fail=1
          done
          # ZERO IS NOT A PASS. A branch carrying backend/app.py with no test beside it has
          # lost them somewhere, and a loop that shrugs at an empty directory is exactly the
          # green tick that would hide it -- the failure this whole step was rewritten over,
          # arriving the other way round.
          if [ "$found" = 0 ]; then
            echo "::error::no backend/test_*.py on this branch, but backend/ is here."
            echo "::error::A backend with no gate on it is not a passing build."
            exit 1
          fi
          echo "-- $found backend test file(s) run"
          exit $fail

      # The extraction and serving self-checks. These existed and were NOT run here, which
      # is how `serving_fill.py --demo` came to be failing on every invocation while looking
      # like a passing suite: it hid three separate faults, each masked by the one before it,
      # and nothing noticed for as long as nobody ran it by hand. A self-check nobody runs is
      # not a test, it is a comment that can rot.
      #
      # The commands, and what each one gates, are in deploy/selfcheck.sh -- shared with
      # deploy.yml so a check added here cannot gate a PR while missing from the push
      # that actually reaches a machine.
      - name: Extraction + serving self-checks
        run: bash deploy/selfcheck.sh

  # The RENDERED page. Every other gate in this repository reads source or data; not one
  # of them renders anything, so a class name that matches no CSS rule was invisible to
  # all of them. `.lh-note` was written as `.tech-list-h .lh-note` and the notice that
  # uses it is a SIBLING of that header -- it rendered 14px sans across the full pane
  # beside an 11px mono note, on all eight Technology tabs, with a green build.
  #
  # No screenshots and no baseline: a pixel differ's baseline would have been taken from
  # the broken page. ui_audit.mjs asserts invariants that are wrong on their own terms.
  # It runs against the built bundle with the committed dataset snapshot, so it needs no
  # database and no network.
  layout:
    needs: resolve
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Reads one function out of the source and checks its arithmetic -- no build, no
      # browser, no dataset -- so it runs before the expensive half and fails fast.
      # "active" on a tie read from a 2010 article is a claim about 2010, and the graph
      # drew it identically to one read last week until this was gated.
      - name: A tie is only active as of the article it was read from
        working-directory: frontend
        run: node test_status_asof.mjs

      # The roster badge answers "is this rival's partner also KSSL's?" and had two
      # answers for a three-answer question, so "the overlap join never ran" rendered
      # as a confident green "Direct Partner" -- on every partner on the tab.
      - name: Absence of a check is not a finding
        working-directory: frontend
        run: node test_overlap_badge.mjs

      # AND EVERY OTHER ONE. The two steps above named a single file each, which is how
      # 36 working tests came to run nowhere: `ls frontend/test_*.mjs` finds 39, all of
      # them pass, and CI ran two. The one that could not run -- test_feed_pagination,
      # which reads an untracked live export -- threw instead of skipping, and that
      # single crash is why nobody wired the directory in. It skips now.
      #
      # Same loop the signals suite uses, and for the same reason: a new regression test
      # should be picked up by being written, not by also remembering to edit this file.
      - name: Frontend regression tests
        working-directory: frontend
        run: |
          # test_tender_row.mjs imports esbuild to compile the .jsx it asserts over, so
          # the loop needs node_modules. It passed on every developer machine, where
          # node_modules exists, and this is the first CI run that has ever executed the
          # loop -- a gate that had never run once.
          npm ci
          fail=0
          for t in test_*.mjs; do
            echo "== $t"
            node "$t" || fail=1
          done
          exit $fail

      - name: Build the bundle and serve it
        working-directory: frontend
        # THE PREVIEW SERVER HAS TO BE KILLED, and on ubuntu-latest it never had to be: the
        # VM was destroyed after the job and a backgrounded process cost nothing. A
        # self-hosted runner is a machine that stays. Left alone, `vite preview` outlives
        # the job holding port 5179, and --strictPort then fails the NEXT run on a port the
        # last run left behind -- a red build with nothing wrong in the commit. The pid goes
        # to $RUNNER_TEMP, which is cleared between jobs, and the always-step at the end of
        # this job collects it whether the audit passed, failed or timed out.
        run: |
          npm run build
          npx vite preview --port 5179 --strictPort &
          echo $! > "$RUNNER_TEMP/preview.pid"
          npx wait-on http://127.0.0.1:5179 -t 60000
      - name: Chromium
        working-directory: frontend
        # --no-save: playwright must not enter package.json, or `npm ci` in the image
        # build downloads a browser into the production frontend image.
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Layout audit + canary
        working-directory: frontend
        env:
          UI_DATASET: ../db/live_dataset.json
        run: node ui_audit.mjs

      - name: Stop the preview server
        # `$!` is npx, and vite is its child, so killing the recorded pid on its own can
        # leave the listener behind. The pkill pattern is the fallback and is narrow enough
        # to match nothing else on a box that also runs staging.
        if: always()
        run: |
          PID="$(cat "$RUNNER_TEMP/preview.pid" 2>/dev/null || true)"
          if [ -n "$PID" ]; then kill "$PID" 2>/dev/null || true; fi
          pkill -f "vite preview --port 5179" 2>/dev/null || true
          exit 0
