name: CI

# Gates on every PR into kssl-deploy: the images must build (the Vite build is the real
# frontend gate; the backend image build validates its deps), backend lints clean, and the
# hermetic pipeline self-tests pass. No deploy, no registry push — that is deploy.yml's job.
on:
  # Every promotion step is a PR, so all three targets gate the same way:
  #   feature -> dev -> staging -> main
  pull_request:
    branches: [main, staging, dev]
  # ...and on the push itself, because this repository is ALSO pushed to directly. Until
  # this trigger existed, ci.yml ran on no commit that ever reached a machine -- including
  # the schema job, which is exactly the check that catches a migration whose result does
  # not match db/schema_snapshot.txt. Being required by branch protection needs it to have
  # run; it cannot be required while it never runs.
  push:
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  build-images:
    # PRs only. deploy.yml builds and PUSHES the same three images on every push to
    # main/staging/dev, so running this there too builds each image twice against the
    # same gha cache scope for no extra signal.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: backend
            context: .
            dockerfile: ./backend/Dockerfile
          - service: extraction
            context: ./extraction
            dockerfile: ./extraction/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  schema:
    # The schema files must build the database they claim to describe. Before this job,
    # db/*.sql was eleven columns and a table behind production -- every one of them
    # added by a hand-applied ALTER over ssh that no file recorded.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kssl
          POSTGRES_DB: kssl
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DSN: postgresql://postgres:kssl@127.0.0.1:5432/kssl
    steps:
      - uses: actions/checkout@v4
      - name: Apply the base schema in filename order
        # Base files only, which is what a new database gets: each migration's effect
        # is folded back into these files in the same commit that adds the migration,
        # so replaying migrations here would double-apply them.
        # ponytail: this does not replay migrations against the previous schema, so a
        # broken migration is caught by the runner's transaction at deploy time rather
        # than here. Worth building if one ever lands badly.
        #
        # The glob is [0-9][0-9]_*.sql, the SAME one extraction/entrypoint.sh applies, not
        # db/*.sql. db/ also holds sanitise_replica.sql, which is a DELETE run against a
        # restored replica -- a bare *.sql glob would apply it here as if it were schema.
        run: |
          for f in db/[0-9][0-9]_*.sql; do
            echo "-- $f"
            psql "$DSN" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: The result must match db/schema_snapshot.txt
        run: |
          ./db/schema_snapshot.sh "$DSN" > /tmp/actual.txt
          # A schema change is fine; a schema change that was not snapshotted is not.
          # Regenerate with:  db/schema_snapshot.sh "$KSSL_DSN" > db/schema_snapshot.txt
          diff -u db/schema_snapshot.txt /tmp/actual.txt

      - name: The replica sanitise must still match that schema
        # db/sanitise_replica.sql is what keeps the client's own pages off a QA box. It is
        # a DELETE whose predicate is a regex against columns this schema defines, so it
        # rots the moment a column moves -- and a regex that silently matches nothing
        # looks exactly like a clean database. The test plants rows it must remove, rows
        # it must keep, and one only its own guard can catch.
        run: ./db/test_sanitise_replica.sh "$DSN"

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (backend + pipeline)
        run: |
          pip install ruff
          ruff check backend pipeline || true   # advisory until the tree is clean
      - name: Hermetic pipeline self-test
        run: |
          pip install httpx psycopg2-binary
          python pipeline/fetch_tenders.py --demo

      # deploy.sh runs no migrations, on any environment -- sync_from_prod.sh is the
      # only thing that does, and says so itself. So a commit that adds a column to a
      # backend field list AND ships its migration puts a backend that selects that
      # column in front of a database without it on the very next deploy. The
      # competitors query is the first one in _dataset, so that is not a missing field,
      # it is 500 for GET /api/dataset and a blank dashboard. It happened on staging on
      # 2026-09-06 with `country`. No database needed: the cursor is a stub.
      - name: Backend degrades when its migration has not run
        run: |
          pip install fastapi
          python backend/test_optional_columns.py

      # The extraction and serving self-checks. These existed and were NOT run here, which
      # is how `serving_fill.py --demo` came to be failing on every invocation while looking
      # like a passing suite: it hid three separate faults, each masked by the one before it,
      # and nothing noticed for as long as nobody ran it by hand. A self-check nobody runs is
      # not a test, it is a comment that can rot.
      #
      # The commands, and what each one gates, are in deploy/selfcheck.sh -- shared with
      # deploy.yml so a check added here cannot gate a PR while missing from the push
      # that actually reaches a machine.
      - name: Extraction + serving self-checks
        run: bash deploy/selfcheck.sh

  # The RENDERED page. Every other gate in this repository reads source or data; not one
  # of them renders anything, so a class name that matches no CSS rule was invisible to
  # all of them. `.lh-note` was written as `.tech-list-h .lh-note` and the notice that
  # uses it is a SIBLING of that header -- it rendered 14px sans across the full pane
  # beside an 11px mono note, on all eight Technology tabs, with a green build.
  #
  # No screenshots and no baseline: a pixel differ's baseline would have been taken from
  # the broken page. ui_audit.mjs asserts invariants that are wrong on their own terms.
  # It runs against the built bundle with the committed dataset snapshot, so it needs no
  # database and no network.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Reads one function out of the source and checks its arithmetic -- no build, no
      # browser, no dataset -- so it runs before the expensive half and fails fast.
      # "active" on a tie read from a 2010 article is a claim about 2010, and the graph
      # drew it identically to one read last week until this was gated.
      - name: A tie is only active as of the article it was read from
        working-directory: frontend
        run: node test_status_asof.mjs

      # The roster badge answers "is this rival's partner also KSSL's?" and had two
      # answers for a three-answer question, so "the overlap join never ran" rendered
      # as a confident green "Direct Partner" -- on every partner on the tab.
      - name: Absence of a check is not a finding
        working-directory: frontend
        run: node test_overlap_badge.mjs

      # AND EVERY OTHER ONE. The two steps above named a single file each, which is how
      # 36 working tests came to run nowhere: `ls frontend/test_*.mjs` finds 39, all of
      # them pass, and CI ran two. The one that could not run -- test_feed_pagination,
      # which reads an untracked live export -- threw instead of skipping, and that
      # single crash is why nobody wired the directory in. It skips now.
      #
      # Same loop the signals suite uses, and for the same reason: a new regression test
      # should be picked up by being written, not by also remembering to edit this file.
      - name: Frontend regression tests
        working-directory: frontend
        run: |
          # test_tender_row.mjs imports esbuild to compile the .jsx it asserts over, so
          # the loop needs node_modules. It passed on every developer machine, where
          # node_modules exists, and this is the first CI run that has ever executed the
          # loop -- a gate that had never run once.
          npm ci
          fail=0
          for t in test_*.mjs; do
            echo "== $t"
            node "$t" || fail=1
          done
          exit $fail

      - name: Build the bundle and serve it
        working-directory: frontend
        run: |
          npm run build
          npx vite preview --port 5179 --strictPort &
          npx wait-on http://127.0.0.1:5179 -t 60000
      - name: Chromium
        working-directory: frontend
        # --no-save: playwright must not enter package.json, or `npm ci` in the image
        # build downloads a browser into the production frontend image.
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Layout audit + canary
        working-directory: frontend
        env:
          UI_DATASET: ../db/live_dataset.json
        run: node ui_audit.mjs
