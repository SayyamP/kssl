# VPS-B automatic extraction. Three long-running roles from one image; the queue in Postgres is the
# hand-off between them, so they never talk directly and any one can restart without the others.
#
#   docker compose run --rm migrate     # once, to create the tables
#   docker compose up -d                 # worker + feeder (+ cards) run forever
#
# The corpus tunnel (DC Postgres -> 127.0.0.1:15432) must be up on the host; feeder reads through it.
# The farm (LLM + GLiNER) is reached over the internet with the key in .env.
services:
  # One-shot: apply db/*.sql to VPS-B Postgres. `docker compose run --rm migrate`.
  migrate:
    build: .
    image: kssl-extraction:latest
    env_file: .env
    network_mode: host
    command: ["migrate"]
    restart: "no"

  # The worker: claim -> extract (farm) -> store, forever. Scale with --scale worker=N; each worker
  # claims its own documents (FOR UPDATE SKIP LOCKED), so N workers is N-way parallelism.
  worker:
    build: .
    image: kssl-extraction:latest
    env_file: .env
    network_mode: host
    command: ["worker"]
    restart: unless-stopped
    # Queue-mode parallelism = container replicas (run_node --workers is a no-op in --node mode;
    # each replica claims its own docs via FOR UPDATE SKIP LOCKED).
    # `docker compose up -d` honors this, so CI redeploys keep the scale instead of dropping to 1.
    # This number IS the deployed scale: a `docker compose up` (including a CI redeploy) resets any
    # runtime `--scale` back to it, so raising the fleet means raising it HERE, not on the box.
    # Kharghar serves 9 nodes x FARM_NODE_PARALLEL 6 = 54 slots; one worker fills one slot.
    deploy:
      replicas: 54

  # Second worker pool, pointed at the PUNE farm. Identical role and image; only the three
  # endpoints differ. KSSL_NODE deliberately stays "farm": route.py's NODES table has entries for
  # vps-a / dc / vps-b / farm only, and the lease window, class cap and tok/s tuning all hang off
  # that key -- an unknown node name would have no tuning at all. Both pools therefore claim as
  # 'farm', which is safe because claiming is FOR UPDATE SKIP LOCKED and atomic.
  #
  # One key serves both front doors: comprehend._auth() sends OLLAMA_API_KEY as the bearer for the
  # LLM *and* for GLiNER, and the Pune gateway uses its master_key for both.
  worker-pune:
    build: .
    image: kssl-extraction:latest
    env_file: .env
    network_mode: host
    command: ["worker"]
    restart: unless-stopped
    environment:
      OLLAMA_URL: "https://pune-llm.i3softlab.com"
      OLLAMA_API_KEY: "${PUNE_API_KEY:?set PUNE_API_KEY in extraction/.env}"
      C_GLINER_URL: "https://pune-gliner.i3softlab.com/extract"
      C_FARM_HEALTH_URL: "https://pune-llm.i3softlab.com/v1/models"
    # Pune runs 12 nodes x num_parallel 12 = 144 slots (q8_0 KV cache + flash attention, set from
    # farm.yaml so it survives a reboot; the gateway derives FARM_NODE_PARALLEL from the same key).
    # One worker fills one slot: run_node.py in --node mode calls drain(), which is single
    # threaded and holds one document at a time, so 72 workers left every node at 6/12 running.
    # 54 + 144 + ~12 service connections = 210, against kssl-db max_connections=300.
    deploy:
      replicas: 144

  # The feeder: sync new corpus docs -> enqueue (presignal gate) -> reap expired leases, on a timer.
  feeder:
    build: .
    image: kssl-extraction:latest
    env_file: .env
    network_mode: host
    command: ["feeder"]
    restart: unless-stopped

  # Cards for the dashboard: projects extracted.* -> serving.card (upsert, own table).
  cards:
    build: .
    image: kssl-extraction:latest
    env_file: .env
    network_mode: host
    command: ["cards"]
    restart: unless-stopped

  # Signals: extracted docs -> UI feed cards (serving.signal_card/detail) via the
  # signal-generation LLM running on VPS-A. Workers keep hitting the farm (env_file
  # OLLAMA_URL); only THIS role is overridden to VPS-A's model over the reverse tunnel.
  signals:
    build: .
    image: kssl-extraction:latest
    env_file: .env
    network_mode: host
    command: ["signals"]
    restart: unless-stopped
    environment:
      # Farm is PRIMARY: OLLAMA_URL / OLLAMA_API_KEY / C_MODEL come from .env (same as the
      # workers). VPS-A Ollama is the FALLBACK, used only when the farm is unreachable --
      # llmapi prints a loud [ALERT] on failover/recovery. KSSL_MODEL only labels the timer.
      FALLBACK_URL: "http://127.0.0.1:11500"
      FALLBACK_MODEL: "qwen2.5:7b-instruct"
      C_MODEL: "serving-model"      # dedicated 2-node farm pool (HEPC-05 + J9F0LTF), off the extraction pool
      KSSL_MODEL: "serving-model"

  # Enrichment: fill the REMAINING serving tables (competitors, matchup, geo, innovation,
  # patent, partner, tender, sources) from extracted.* via the same farm-primary LLM client
  # as signals. Full idempotent rebuild on a slow timer; touches only origin='pipeline'.
  enrich:
    build: .
    image: kssl-extraction:latest
    env_file: .env
    network_mode: host
    command: ["enrich"]
    restart: unless-stopped
    environment:
      FALLBACK_URL: "http://127.0.0.1:11500"
      FALLBACK_MODEL: "qwen2.5:7b-instruct"
      C_MODEL: "serving-model"      # dedicated 2-node farm pool (HEPC-05 + J9F0LTF), off the extraction pool
      KSSL_MODEL: "serving-model"
      ENRICH_EVERY_S: "7200"

  # Layer B: canonical entities from the extracted spans, on a slow timer. Same-script merges;
  # cross-script (embedding) blocking is a documented extension. Enable when Layer A has a backlog.
  layerb:
    build: .
    image: kssl-extraction:latest
    env_file: .env
    network_mode: host
    command: ["layerb"]
    restart: unless-stopped
